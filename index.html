
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vayu - Universal Composition Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --m3-sys-light-primary: #4f46e5;
            --m3-sys-light-on-primary: #ffffff;
            --m3-sys-light-surface: #fdfbff;
            --m3-sys-light-on-surface: #1b1b1f;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            scrollbar-width: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fc;
            color: var(--m3-sys-light-on-surface);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            width: 100vw;
        }

        h1, h2, h3, h4, .font-display {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .elevation-1 { box-shadow: 0px 1px 3px 1px rgba(0, 0, 0, 0.1), 0px 1px 2px 0px rgba(0, 0, 0, 0.2); }
        .elevation-2 { box-shadow: 0px 2px 6px 2px rgba(0, 0, 0, 0.08), 0px 1px 2px 0px rgba(0, 0, 0, 0.15); }

        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .app-container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding-left: 1rem;
            padding-right: 1rem;
            padding-top: max(1.5rem, env(safe-area-inset-top));
        }

        @media (min-width: 768px) { .app-container { max-width: 768px; } }
        @media (min-width: 1024px) { .app-container { max-width: 960px; } }

        ::-webkit-scrollbar { display: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.474.0?external=react",
    "framer-motion": "https://esm.sh/framer-motion@11.18.2?external=react,react-dom",
    "gsap": "https://esm.sh/gsap@3.12.5",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
